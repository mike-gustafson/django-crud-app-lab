{% extends 'base.html' %}

{% block content %}
<div class="form-view">
    <h1>Edit {{ accessory.name }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="action-buttons">
            <button type="submit" class="btn">Update Accessory</button>
            <a href="{% url 'accessories_detail' accessory.id %}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
