{% extends 'base.html' %}

{% block content %}
<h1>Add a New Accessory for {{ system.name }}</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Add Accessory</button>
</form>

<a href="{% url 'systems_detail' system.id %}" class="btn">Cancel</a>
{% endblock %}
