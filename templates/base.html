<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collector</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header>
        <nav>
            <div class="nav-wrapper">
                <a href="{% url 'home' %}" class="brand-logo">Game Collector</a>
                <ul class="right">
                    {% if user.is_authenticated %}
                    <li><a href="{% url 'systems_index' %}">All Systems</a></li>
                    <li><a href="{% url 'systems_create' %}">Add a System</a></li>
                    <li><a href="{% url 'account' %}">My Account</a></li>
                    <li>
                        <form action="{% url 'logout' %}" method="POST" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn-link">Log Out</button>
                        </form>
                    </li>
                    {% else %}
                    <li><a href="{% url 'login' %}">Log In</a></li>
                    <li><a href="{% url 'signup' %}">Sign Up</a></li>
                    {% endif %}
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="page-footer">
        <div class="right">All Rights Reserved, &copy; 2025 Game Collector</div>
    </footer>
</body>
</html>
