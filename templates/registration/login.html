{% extends 'base.html' %}

{% block content %}
<div class="form-view">
    <h1>Log In</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="action-buttons">
            <button type="submit" class="btn">Log In</button>
        </div>
    </form>

    <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
</div>
{% endblock %}
